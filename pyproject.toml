[project]
name = "uwcourses-generation"
version = "0.1.0"
description = "uwcourses data pipeline"
readme = "generation/README.md"
requires-python = "==3.12.*"
dependencies = [
    "scrapy>=2.18,<3",
    "pydantic>=2.10,<3",
    "pyarrow>=19",
    "huggingface-hub>=0.33,<2",
    "anyascii>=0.3.3",
    "beautifulsoup4>=4.13.4",
    "diskcache>=5.6.3",
    "fake-useragent>=2.2.0",
    "frozendict>=2.4.6",
    "hf-xet>=1.1.5",
    "lxml>=6.0.0",
    "nameparser>=1.1.3",
    "pathvalidate>=3.3.1",
    "python-dotenv>=1.1.1",
    "rapidfuzz>=3.13.0",
    "requests>=2.32.4",
    "tqdm>=4.67.1",
    "jsonschema>=4.23,<5",
    "pydantic-ai-slim[openai]>=2.36,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "datasets>=4.7,<5",
]

[dependency-groups]
dev = [
    "ruff>=0.12.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
uwcourses = "uwcourses.cli:main"
uwcourses-site = "uwcourses_site.cli:main"

[tool.setuptools]
package-dir = {"" = "generation", "uwcourses_site" = "web/uwcourses_site"}
packages = ["uwcourses", "uwcourses_site"]

[tool.setuptools.package-data]
uwcourses = ["migrations/*.py", "migrations/versions/*.py"]
uwcourses_site = ["schema-v6.json"]

[tool.ruff.lint]
# Keep the existing rule set explicit across Ruff default-rule changes.
select = ["E4", "E7", "E9", "F"]

name: Svelte
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      first_deployment:
        description: First deployment (Worker does not exist yet)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: svelte-resolve-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      changed: ${{ steps.resolve.outputs.changed }}
      import_key: ${{ steps.resolve.outputs.import_key }}
      documents_key: ${{ steps.resolve.outputs.documents_key }}
      social_key: ${{ steps.resolve.outputs.social_key }}
      browser_key: ${{ steps.resolve.outputs.browser_key }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - id: resolve
        run: uv run --locked uwcourses-site resolve
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: website-plan
          path: .site/plan.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  data:
    outputs:
      documents_key: ${{ needs.resolve.outputs.documents_key }}
      social_key: ${{ needs.resolve.outputs.social_key }}
      browser_key: ${{ needs.resolve.outputs.browser_key }}
    name: Data
    needs: [resolve]
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: svelte-data-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: website-plan
          path: .site
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: .site/import
          key: ${{ runner.os }}-import-${{ needs.resolve.outputs.import_key }}
      - id: valid
        run: uv run --locked uwcourses-site cache-check --stage import
      - if: steps.valid.outputs.valid != 'true'
        run: uv run --locked uwcourses-site import --revision ${{ needs.resolve.outputs.revision }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - run: uv run --locked uwcourses-site release-check
      - run: uv run --locked python -m unittest discover -s web/tests -p 'test_*.py'
      - if: steps.valid.outputs.valid != 'true'
        run: uv run --locked uwcourses-site cache-seal --stage import
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: .site/import
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - run: tar -I 'zstd -T0' -cf website-data.tar.zst .site/import
      - uses: actions/upload-artifact@v7
        with:
          name: website-data
          path: website-data.tar.zst
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  documents:
    outputs:
      documents_key: ${{ needs.data.outputs.documents_key }}
      social_key: ${{ needs.data.outputs.social_key }}
    name: Documents
    needs: [data]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: svelte-documents-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: website-plan
          path: .site
      - uses: actions/download-artifact@v8
        with:
          name: website-data
      - run: tar --zstd -xf website-data.tar.zst
      - run: rm website-data.tar.zst
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: .site/documents
          key: ${{ runner.os }}-documents-${{ needs.data.outputs.documents_key }}
      - id: valid
        run: uv run --locked uwcourses-site cache-check --stage documents
      - if: steps.valid.outputs.valid != 'true'
        run: bun run site:data
      - if: steps.valid.outputs.valid != 'true'
        run: uv run --locked uwcourses-site cache-seal --stage documents
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: .site/documents
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - run: tar -I 'zstd -T0' -cf website-documents.tar.zst .site/documents
      - uses: actions/upload-artifact@v7
        with:
          name: website-documents
          path: website-documents.tar.zst
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  social:
    name: Social
    needs: [documents]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: svelte-social-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: website-plan
          path: .site
      - uses: actions/download-artifact@v8
        with:
          name: website-documents
      - run: tar --zstd -xf website-documents.tar.zst
      - run: rm website-documents.tar.zst
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: .site/social
          key: ${{ runner.os }}-social-${{ needs.documents.outputs.social_key }}
      - id: valid
        run: uv run --locked uwcourses-site cache-check --stage social
      - if: steps.valid.outputs.valid != 'true'
        run: bun x playwright install --with-deps chromium
      - uses: actions/cache/restore@v6
        if: steps.valid.outputs.valid != 'true'
        id: cards
        with:
          path: .site/social-cache
          key: ${{ runner.os }}-cards-${{ hashFiles('web/*social*', 'static/fonts/*', 'static/uwcourses-logo.svg', 'bun.lock') }}-${{ needs.documents.outputs.documents_key }}
          restore-keys: |
            ${{ runner.os }}-cards-${{ hashFiles('web/*social*', 'static/fonts/*', 'static/uwcourses-logo.svg', 'bun.lock') }}-
      - if: steps.valid.outputs.valid != 'true'
        run: bun run site:social
      - if: steps.valid.outputs.valid != 'true'
        run: uv run --locked uwcourses-site cache-seal --stage social
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: .site/social
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if: steps.valid.outputs.valid != 'true' && steps.cards.outputs.cache-hit != 'true'
        with:
          path: .site/social-cache
          key: ${{ steps.cards.outputs.cache-primary-key }}
      - run: tar -I 'zstd -T0' -cf website-social.tar.zst .site/social
      - uses: actions/upload-artifact@v7
        with:
          name: website-social
          path: website-social.tar.zst
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  tests:
    name: Tests
    needs: [data]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: svelte-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: website-data
      - run: tar --zstd -xf website-data.tar.zst
      - run: rm website-data.tar.zst
      - run: bun run check
      - run: bun run test
  app:
    name: Build
    needs: [data]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: svelte-app-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: website-data
      - run: tar --zstd -xf website-data.tar.zst
      - run: rm website-data.tar.zst
      - run: bun run build
        env:
          SITE_ASSETS: deferred
      - run: tar -I 'zstd -T0' -cf website-app.tar.zst .svelte-kit/cloudflare .svelte-kit/cloudflare-tmp .svelte-kit/output/server
      - uses: actions/upload-artifact@v7
        with:
          name: website-app
          path: website-app.tar.zst
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  build:
    name: Assets
    needs: [social, app]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: svelte-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: website-plan
          path: .site
      - uses: actions/download-artifact@v8
        with:
          name: website-data
      - run: tar --zstd -xf website-data.tar.zst
      - run: rm website-data.tar.zst
      - uses: actions/download-artifact@v8
        with:
          name: website-documents
      - run: tar --zstd -xf website-documents.tar.zst
      - run: rm website-documents.tar.zst
      - uses: actions/download-artifact@v8
        with:
          name: website-social
      - run: tar --zstd -xf website-social.tar.zst
      - run: rm website-social.tar.zst
      - run: uv run --locked uwcourses-site cache-verify --stage import
      - run: uv run --locked uwcourses-site cache-verify --stage documents
      - run: uv run --locked uwcourses-site cache-verify --stage social
      - uses: actions/download-artifact@v8
        with:
          name: website-app
      - run: tar --zstd -xf website-app.tar.zst
      - run: rm website-app.tar.zst
      - run: bun run site:assemble
      - run: bun run seo:check
      - run: uv run --locked uwcourses-site assets-check
      - run: tar -I 'zstd -T0' -cf website-build.tar.zst .svelte-kit/cloudflare .svelte-kit/cloudflare-tmp .svelte-kit/output/server
      - uses: actions/upload-artifact@v7
        with:
          name: website-build
          path: website-build.tar.zst
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  browser-data:
    name: Database
    needs: [data]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: svelte-browser-data-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: website-plan
          path: .site
      - uses: actions/download-artifact@v8
        with:
          name: website-data
      - run: tar --zstd -xf website-data.tar.zst
      - run: rm website-data.tar.zst
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: .site/browser-state
          key: ${{ runner.os }}-browser-${{ needs.data.outputs.browser_key }}
      - id: valid
        run: uv run --locked uwcourses-site cache-check --stage browser
      - if: steps.valid.outputs.valid != 'true'
        run: bun run test:browser:setup
      - if: steps.valid.outputs.valid != 'true'
        run: uv run --locked uwcourses-site cache-seal --stage browser
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: .site/browser-state
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - run: tar -I 'zstd -T0' -cf website-browser-data.tar.zst .site/browser-state
      - uses: actions/upload-artifact@v7
        with:
          name: website-browser-data
          path: website-browser-data.tar.zst
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  browser:
    name: Browser ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    needs: [build, browser-data]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: svelte-browser-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: website-data
      - run: tar --zstd -xf website-data.tar.zst
      - run: rm website-data.tar.zst
      - uses: actions/download-artifact@v8
        with:
          name: website-build
      - run: tar --zstd -xf website-build.tar.zst
      - run: rm website-build.tar.zst
      - uses: actions/download-artifact@v8
        with:
          name: website-browser-data
      - run: tar --zstd -xf website-browser-data.tar.zst
      - run: rm website-browser-data.tar.zst
      - run: bun x playwright install --with-deps chromium
      - run: bun x svelte-kit sync
      - run: bun x playwright test --shard=${{ matrix.shard }}/2
        env:
          BROWSER_DB_PREPARED: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  check:
    name: Svelte
    if: always()
    needs: [resolve, tests, browser]
    outputs:
      changed: ${{ needs.resolve.outputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        env:
          PASSED: ${{ needs.resolve.result == 'success' && (needs.resolve.outputs.changed == 'false' || (needs.tests.result == 'success' && needs.browser.result == 'success')) }}
        run: test "$PASSED" = true
  deploy:
    name: Deploy
    needs: [check]
    if: needs.check.outputs.changed == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: website-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://uwcourses.com
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: website-data
      - run: tar --zstd -xf website-data.tar.zst
      - run: rm website-data.tar.zst
      - uses: actions/download-artifact@v8
        with:
          name: website-build
      - run: tar --zstd -xf website-build.tar.zst
      - run: rm website-build.tar.zst
      - name: Deploy
        id: deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIRST_DEPLOYMENT: ${{ inputs.first_deployment || false }}
        run: uv run --locked uwcourses-site deploy
      - name: Sync Cloudflare endpoint inventory
        if: steps.deploy.outputs.deployed == 'true'
        timeout-minutes: 5
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun x svelte-kit sync
          bun run cloudflare:endpoints --apply > .site/endpoint-sync.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-release
          path: |
            .site/import/status.json
            .site/import/d1-check.json
            .site/endpoint-sync.json
          include-hidden-files: true
          retention-days: 30

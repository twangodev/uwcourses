# Revisions are resolved to immutable commits when an enrichment run is created.
[profiles.enrichment]
model = "Qwen/Qwen3.6-35B-A3B-FP8"
base_url = "http://127.0.0.1:8003/v1"
runner = "generate"
context_length = 8192
max_output_tokens = 2048
concurrency = 16
temperature = 0.2
thinking = false
server_args = ["--kv-cache-dtype", "fp8", "--reasoning-parser", "qwen3", "--gpu-memory-utilization", "0.65", "--max-num-seqs", "16", "--enforce-eager", "--language-model-only"]

[profiles.enrichment-nvfp4]
model = "nvidia/Qwen3.6-35B-A3B-NVFP4"
base_url = "http://127.0.0.1:8003/v1"
runner = "generate"
context_length = 8192
max_output_tokens = 2048
concurrency = 32
temperature = 0.2
thinking = false
server_args = ["--quantization", "modelopt_fp4", "--kv-cache-dtype", "fp8", "--reasoning-parser", "qwen3", "--gpu-memory-utilization", "0.65", "--max-num-seqs", "32", "--enforce-eager", "--language-model-only"]

[profiles.enrichment-bf16]
model = "Qwen/Qwen3.6-35B-A3B"
base_url = "http://127.0.0.1:8003/v1"
runner = "generate"
context_length = 8192
max_output_tokens = 2048
concurrency = 8
server_args = ["--dtype", "bfloat16", "--reasoning-parser", "qwen3", "--gpu-memory-utilization", "0.90", "--max-num-seqs", "8", "--enforce-eager", "--language-model-only"]


[profiles.requirements]
model = "nvidia/Qwen3.6-35B-A3B-NVFP4"
base_url = "http://127.0.0.1:8003/v1"
runner = "generate"
context_length = 16384
max_output_tokens = 4096
concurrency = 32
temperature = 0.0
thinking = false
server_args = ["--quantization", "modelopt_fp4", "--kv-cache-dtype", "fp8", "--reasoning-parser", "qwen3", "--gpu-memory-utilization", "0.65", "--max-num-seqs", "32", "--enforce-eager", "--language-model-only"]

# Throughput profile measured on the 96 GB RTX PRO 6000 at a 300 W cap.
[profiles.enrichment-unified]
model = "nvidia/Qwen3.6-35B-A3B-NVFP4"
base_url = "http://127.0.0.1:8003/v1"
runner = "generate"
context_length = 32768
max_output_tokens = 16384
request_timeout_seconds = 1800
concurrency = 256
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
thinking = false
server_args = ["--quantization", "modelopt_fp4", "--kv-cache-dtype", "fp8", "--reasoning-parser", "qwen3", "--gpu-memory-utilization", "0.80", "--max-num-seqs", "256", "--max-num-batched-tokens", "16384", "--enforce-eager", "--language-model-only", "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_xml"]

# Separate evidence extraction profile; revision is pinned by lock-models/job creation.
# Conservative concurrency for the dense model; operator sizes GPU memory locally.
[profiles.course-skills-qwen38]
model = "Qwen/Qwen3.8-27B"
base_url = "http://127.0.0.1:8003/v1"
runner = "generate"
context_length = 32768
max_output_tokens = 8192
request_timeout_seconds = 1800
concurrency = 4
temperature = 0.0
thinking = false
server_args = ["--dtype", "bfloat16", "--reasoning-parser", "qwen3", "--gpu-memory-utilization", "0.85", "--max-num-seqs", "4", "--language-model-only", "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_xml"]
